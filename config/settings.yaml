# Chart Analyst v0.3 defaults. Committed file: thresholds only, no secrets.
# Mode paper is the only mode this build will run. There is no order placement.

mode: paper
rules_version: "0.3"

indicators:
  bb_period: 20
  bb_std: 2.0
  bb_ddof: 0
  ema_periods: [20, 50, 200]
  rsi_period: 14
  atr_period: 14
  volume_avg_period: 20
  sma_fast: 50
  sma_slow: 200

universe:
  quote_asset: USDT
  contract_type: PERPETUAL
  min_listing_age_days: 14
  # Setups A–C. Setup D overrides these in setups.meme_momentum.
  min_quote_volume: 5000000
  max_spread: 0.0015
  # Skip a long if current or predicted 8h funding is greater than this.
  # Skip a short if either is less than funding_short_min.
  funding_long_max: 0.0005
  funding_short_min: -0.0005

setups:
  squeeze_breakout:
    enabled: true
    bandwidth_lookback: 20
    volume_mult: 1.5
    trigger_bars: 4
    stop_atr_buffer: 0.25
    max_stop_atr: 3.0
    time_stop_bars: 8
    min_daily_bars: 200
    risk_pct: 0.02
    max_leverage: 3
  trend_pullback:
    enabled: true
    rsi_long: [40, 55]
    rsi_short: [45, 60]
    trigger_bars: 8
    stop_atr_buffer: 0.25
    max_stop_atr: 3.0
    time_stop_bars: 12
    min_daily_bars: 200
    risk_pct: 0.02
    max_leverage: 3
    # v0.3 pullback. Research variants override these; do not tighten from a short sample.
    min_ema_gap_atr: 0.0
    allow_caution: true
    stop_swing_bars: 1
    require_fast_ema_tag: false
  range_reclaim:
    enabled: true
    range_bars: 12
    min_range_bars: 8
    range_atr_mult: 1.5
    fakeout_lookback: 6
    volume_mult: 1.2
    trigger_bars: 12
    stop_atr_buffer: 0.25
    max_stop_atr: 3.0
    time_stop_bars: 10
    risk_pct: 0.02
    max_leverage: 3
  meme_momentum:
    enabled: true
    breakout_lookback: 20
    volume_mult: 2.0
    trigger_bars: 4
    stop_atr_buffer: 0.25
    stop_cap_atr: 1.5
    max_stop_atr: 3.0
    time_stop_bars: 8
    hard_max_bars: 16
    min_daily_bars_for_bias: 200
    risk_pct: 0.01
    max_leverage: 1
    min_quote_volume: 1000000
    max_spread: 0.005
    max_notional_of_1h_volume: 0.01

# Working default is 50% off at 2R. Set partial_at_r to 1.0 to compare the
# open question. Use risk.enforce_min_reward_risk: false so a 1R partial is
# not rejected by the v0.3 "at least 2R" entry check.
exits:
  partial_at_r: 2.0
  partial_fraction: 0.5
  # ema + immediate is the v0.3 4H trail (20 EMA and close, both ATR-buffered).
  # chandelier and structure only tighten. trail_arm immediate | after_partial | after_1r.
  trail_mode: ema
  trail_arm: immediate
  trail_ema_atr_mult: 0.25
  trail_close_atr_mult: 1.5
  chandelier_atr_mult: 2.0
  structure_lookback: 3
  structure_atr_buffer: 0.25

risk:
  scale: 1.0
  max_leverage: 3
  max_open_risk_pct: 0.06
  max_cluster_risk_pct: 0.03
  max_setup_d_risk_pct: 0.02
  # If a notional cap cuts risk below this fraction of equity, skip.
  min_risk_after_cap_pct: 0.005
  max_notional_equity_mult: 3.0
  max_notional_equity_mult_setup_d: 1.0
  # Simplified isolated liquidation model. Tier-1 BTC maintenance margin.
  maintenance_margin_rate: 0.004
  liquidation_atr_buffer: 1.0
  daily_loss_pause_pct: -0.04
  weekly_loss_pause_pct: -0.08
  cooldown_days: 7
  min_reward_risk: 2.0
  enforce_min_reward_risk: true

costs:
  taker_fee_rate: 0.0005
  slippage_rate: 0.0001
  # Push TP1 out so the cost-adjusted reward/risk equals partial_at_r.
  cost_bump_tp1: true

# Paper snapshot for a local scan. news_status null fails closed.
# This build never queries account equity from Binance.
account:
  equity_usdt: 800
  use_config_snapshot: true
  daily_pnl_pct: 0.0
  weekly_pnl_pct: 0.0
  news_status: null

blocklist:
  # Local list is readable. Set available: false to simulate News Watcher down.
  available: true
  symbols: []

webhook:
  # Off by default. URL may also be set with WEBHOOK_URL. The HMAC secret is
  # WEBHOOK_SECRET in the environment and is never read from this file.
  enabled: false
  url: ""
  timeout_seconds: 5
  max_retries: 5
  retry_backoff_seconds: 1
  retry_backoff_max_seconds: 60
  secret_env: WEBHOOK_SECRET
  require_signature: true
  signature_max_age_seconds: 300
  send_rejects: false

# A reviewer must attach open or skip before this elapses. The timeout is
# always skip, including when timeout_action is edited.
decision:
  timeout_seconds: 3600
  timeout_action: skip

# Empty listen leaves the review endpoint off. Bind loopback when you serve it.
review:
  listen: ""
  secret_env: REVIEW_SECRET

paper:
  initial_equity: 800
  clock_days: 14
  # A closed 1H bar older than this blocks new entries.
  max_data_age_seconds: 5400
  kill_switch_path: data/KILL
  loop_seconds: 60

journal:
  jsonl_path: data/journal.jsonl

data:
  sqlite_path: data/desk.sqlite
  rest_base: https://fapi.binance.com
  request_timeout_seconds: 20
  request_pause_seconds: 0.25
  kline_limit: 1500
  # Empty means "whatever is already in the local store".
  symbols: []

backtest:
  initial_equity: 800
  allow_assumed_spread: true
  # 0.05% full spread, used only when historical book data does not exist.
  assumed_spread_pct: 0.0005
  # Historical predicted-funding is not in the public fundingRate archive.
  # persist_last_settled reuses the last settled rate and is disclosed on the report.
  funding_predicted_model: persist_last_settled
  # News Watcher history is not a market-data feed. Disclosed on the report.
  news_status: ALLOW
  entry_on: close
  walk_forward_in_sample_days: 182
  walk_forward_out_sample_days: 91
  close_at_end: true
